<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="曾牛-分屏🐮：真实 App 交互小窗、缩放旋转、多档空挂与下探取出，可选通知和快捷入口。内测中，免费授权，反馈群 1121798145。需授权启用，兼容性以安装版本及实测为准。">
<meta name="theme-color" content="#F6C54A">
<title>曾牛-分屏🐮 · 安装与更新说明</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
:root { color-scheme: light dark; --bg:#faf8f3; --card:#fff; --text:#242019; --muted:#625b4e; --line:#dfd8c9; --accent:#8b5700; --notice:#fff2c8; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
main { max-width:820px; margin:auto; padding:28px 18px 60px; overflow-wrap:anywhere; }
a { color:var(--accent); text-underline-offset:3px; }
.back { font-size:14px; }
.hero { display:flex; gap:18px; align-items:center; margin:28px 0 20px; }
.hero img { flex:0 0 87px; width:87px; height:87px; border-radius:22px; background:white; border:1px solid var(--line); }
h1 { font-size:clamp(24px,6vw,34px); line-height:1.3; margin:0 0 6px; }
.subtitle { margin:0; color:var(--muted); font-size:14px; }
.notice { padding:16px 18px; background:var(--notice); border:1px solid var(--line); border-radius:16px; font-size:14px; }
.notice p { margin:5px 0; }
nav { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:24px 0; }
nav a { display:block; padding:12px; text-align:center; text-decoration:none; border:1px solid var(--line); border-radius:12px; background:var(--card); font-weight:600; }
nav a[aria-current="page"] { background:#F6C54A; color:#241b06; border-color:#c3962d; }
nav a:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
.panel { padding:8px 22px 26px; border:1px solid var(--line); border-radius:18px; background:var(--card); }
h2 { font-size:24px; line-height:1.5; margin:24px 0 12px; }
h3 { font-size:19px; line-height:1.5; margin:28px 0 12px; padding-top:20px; border-top:1px solid var(--line); }
.copy { white-space:pre-line; margin:0 0 16px; }
[hidden] { display:none !important; }
footer { margin-top:24px; color:var(--muted); font-size:13px; }
@media(prefers-color-scheme:dark) { :root { --bg:#191815; --card:#22211e; --text:#f3eee5; --muted:#c2b9a9; --line:#4b4539; --accent:#f6c54a; --notice:#332c18; } }
@media(max-width:380px) { main { padding:20px 12px 40px; } .panel { padding:6px 16px 20px; } .hero { gap:12px; } }
</style>
</head>
<body>
<main>
<a class="back" href="../../">← 软件源首页</a>
<header class="hero">
  <img src="icon.png" width="87" height="87" alt="白底黑黄牛头头像">
  <div><h1>曾牛-分屏🐮</h1><p class="subtitle">App 小窗 · 实时空挂 · 底部下探<br>com.zengniu.splitview</p></div>
</header>
<aside class="notice" aria-label="版本状态提醒">
  <p><strong>首次需授权启用，兼容性以实测为准</strong></p>
  <p>历史摘要已整理至 0.8.97（源内当前最新安装包）；插件内测中，免费授权。实际可安装版本请以包管理器刷新后的索引为准。</p>
  <p>功能以安装版本为准；历史源码更新记录不等同于发布或实机验收。</p>
</aside>
<nav aria-label="介绍栏目">
  <a href="#installation" id="installation-link" aria-controls="installation" aria-current="page">安装说明</a>
  <a href="#updates" id="updates-link" aria-controls="updates">更新说明</a>
</nav>
<p id="status" role="status">正在载入介绍…</p>
<section class="panel" id="installation" aria-labelledby="installation-link" hidden></section>
<section class="panel" id="updates" aria-labelledby="updates-link" hidden></section>
<noscript><p>此页面通过 JavaScript 显示与 Sileo 共用的介绍内容。请启用 JavaScript，或查看 <a href="depiction.json">完整介绍数据</a>。</p></noscript>
<footer>更新说明仅保留有依据的主要功能与修复节点，不补写缺失版本或日期。<br><a href="depiction.json">Sileo 原生介绍数据</a> · <a href="../../">返回软件源</a></footer>
</main>
<script>
"use strict";
const panelIDs = ["installation", "updates"];
let ready = false;
function selectPanel() {
  const selected = location.hash === "#updates" ? "updates" : "installation";
  for (const id of panelIDs) {
    document.getElementById(id).hidden = !ready || id !== selected;
    const link = document.getElementById(id + "-link");
    if (id === selected) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  }
}
window.addEventListener("hashchange", selectPanel);
selectPanel();
fetch("depiction.json").then(response => {
  if (!response.ok) throw new Error("HTTP " + response.status);
  return response.json();
}).then(depiction => {
  if (depiction.class !== "DepictionTabView" || !Array.isArray(depiction.tabs) || depiction.tabs.length !== 2) {
    throw new Error("Invalid depiction tabs");
  }
  depiction.tabs.forEach((tab, index) => {
    const panel = document.getElementById(panelIDs[index]);
    for (const view of tab.views) {
      let element;
      if (view.class === "DepictionHeaderView" || view.class === "DepictionSubheaderView") {
        element = document.createElement(view.class === "DepictionHeaderView" ? "h2" : "h3");
        element.textContent = view.title;
      } else if (view.class === "DepictionMarkdownView") {
        // Our native depiction uses plain text paragraphs only: never insert HTML.
        element = document.createElement("p");
        element.className = "copy";
        element.textContent = view.markdown;
      } else {
        throw new Error("Unsupported depiction view");
      }
      panel.append(element);
    }
  });
  ready = true;
  document.getElementById("status").hidden = true;
  selectPanel();
}).catch(() => {
  document.getElementById("status").textContent = "介绍暂时未能载入，请刷新重试，或使用页面底部的原生介绍数据链接。";
});
</script>
</body>
</html>
